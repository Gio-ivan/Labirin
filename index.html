<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Labirin 3D - Eksplorasi Jalan Buntu</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/images/staff.png">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">Memuat Labirin 3D & Karakter...</div>
  </div>

  <!-- 3D WebGL Canvas Container -->
  <div id="canvasContainer"></div>

  <!-- HUD Overlay Layer -->
  <div class="ui-layer">
    <!-- Top-Left: 2D Minimap with Fog of War -->
    <div class="minimap-panel interactive">
      <div class="minimap-title">
        <span class="dot"></span> PETA 2D (KABUT)
      </div>
      <div class="minimap-wrapper">
        <canvas id="minimapCanvas" width="175" height="175"></canvas>
        <div class="minimap-hud">
          <span id="exploredText">Jelajah: 1%</span>
          <span id="playerCoord">Pos: (1, 1)</span>
        </div>
      </div>
    </div>

    <!-- Top-Center: Game Title -->
    <div class="game-header">
      <h1 class="game-title">EKSPLORASI LABIRIN 3D</h1>
      <p class="game-subtitle">Temukan jalan keluar jika kamu bisa!</p>
    </div>

    <!-- Notification Toast (Non-blocking: "Pintu terkunci, cari jalan lain") -->
    <div id="toastPopup" class="toast-popup">
      <span>🔒 Pintu terkunci, cari jalan lain</span>
    </div>

    <!-- Top-Right: Quick Controls -->
    <div class="top-controls interactive">
      <button id="muteBtn" class="icon-btn" title="Nyalakan/Matikan Suara">
        🔊 Audio
      </button>
      <button id="resetBtn" class="icon-btn" title="Kembali ke titik awal">
        🔄 Awal
      </button>
      <button id="fullscreenBtn" class="icon-btn" title="Layar Penuh Proyektor">
        ⛶ Layar
      </button>
    </div>

    <!-- Bottom-Left: Authentic D-Pad Controller -->
    <div id="dpadWrapper" class="dpad-wrapper interactive">
      <div class="dpad-container">
        <button id="btnForward" class="dpad-btn up" title="Maju Lurus">
          ▲
          <span class="label">LURUS</span>
        </button>
        <button id="btnLeft" class="dpad-btn left" title="Belok Kiri">
          ◀
          <span class="label">KIRI</span>
        </button>
        <div class="dpad-center" title="Kompas Arah">🧭</div>
        <button id="btnRight" class="dpad-btn right" title="Belok Kanan">
          ▶
          <span class="label">KANAN</span>
        </button>
        <button id="btnBackward" class="dpad-btn down" title="Putar Balik">
          ▼
          <span class="label">BALIK</span>
        </button>
      </div>
    </div>

    <!-- Bottom-Center: Status Banner & Door Interaction Button -->
    <div class="bottom-center-container">
      <button id="btnDoorInteract" class="door-interact-btn hidden">
        🚪 Buka Pintu
      </button>
      <div id="statusBanner" class="status-banner">
        Tekan tombol D-Pad untuk mulai berlari menyusuri labirin!
      </div>
    </div>
  </div>

  <!-- Three.js Engine & GLTF Loader (Local offline files) -->
  <script src="assets/js/three.min.js"></script>
  <script src="assets/js/GLTFLoader.js"></script>
  <!-- Embedded 3D Character Model (Bypasses file:/// CORS blocks) -->
  <script src="assets/models/character_data.js"></script>

  <!-- 3D Game Engine & Minimap Script -->
  <script src="script.js"></script>
</body>
</html>
